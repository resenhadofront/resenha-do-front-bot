name: Executar Robo Resenha do Front

on:
  workflow_dispatch: # Ativa o botão para rodar manualmente

jobs:
  construir-e-rodar:
    runs-on: ubuntu-latest

    steps:
    # 1. Copia os arquivos do seu repositório para o servidor da nuvem
    - name: Baixando o código do repositório
      uses: actions/checkout@v4

    # 2. Prepara o ambiente Python gratuito na nuvem
    - name: Configurando o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Lê o seu arquivo requirements.txt e instala as bibliotecas
    - name: Instalando as bibliotecas do robô
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Roda o script injetando as chaves que guardamos nos Secrets
    - name: Executando o Script do Robô
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: python bot.py

    # 5. NOVO: Salva o vídeo final gerado para você conseguir baixar e assistir!
    - name: Salvando o Vídeo Gerado (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: video-de-teste-front
        path: video_final.mp4
